          type: string
          format: uuid
        email:
          type: string
        totalPoints:
          type: integer
          format: int32
        rank:
          type: integer
          format: int32
        leaguePoints:
          type: integer
          format: int32
    PlayerSlot:
      type: object
      properties:
        playerId:
          type: string
          format: uuid
        name:
          type: string
        position:
          type: string
        team:
          type: string
        points:
          type: integer
          format: int32
        pic:
          type: string
    RosterResponse:
      type: object
      properties:
        participantId:
          type: string
          format: uuid
        formation:
          type: string
        players:
          type: array
          items:
            $ref: "#/components/schemas/PlayerSlot"
    ChatHistoryPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Item"
        nextCursor:
          type: string
        hasMore:
          type: boolean
    ChatRoomDto:
      type: object
      properties:
        roomId:
          type: string
          format: uuid
        draftId:
          type: string
          format: uuid
    AssignDto:
      required:
      - draftId
      type: object
      properties:
        draftId:
          type: string
          description: 드래프트 ID (UUID)
          format: uuid
          example: 11111111-1111-1111-1111-111111111111
        userNumber:
          maximum: 4
          minimum: 1
          type: integer
          description: 방 내 좌석 번호 (1~4)
          format: int32
          example: 2
      description: 내 드래프트 배정(좌석) 정보
    DraftStartMessage:
      required:
      - draftId
      - type
      type: object
      properties:
        type:
          type: string
          description: 메시지 타입
          example: DRAFT_START
          enum:
          - DRAFT_START
        draftId:
          type: string
          description: 드래프트 ID (UUID)
          format: uuid
          example: 11111111-1111-1111-1111-111111111111
        userNumber:
          maximum: 4
          minimum: 1
          type: integer
          description: 방 내 좌석 번호 (1~4)
          format: int32
          example: 3
      description: 드래프트 시작(WebSocket) 메시지
      example:
        type: DRAFT_START
        draftId: 11111111-1111-1111-1111-111111111111
        userNumber: 3
    MatchStatusResponse:
      type: object
      properties:
        count:
          type: integer
          description: 현재 대기(세션) 사용자 수
          format: int64
          example: 27
        state:
          type: string
          description: 라운드 상태
          example: OPEN
          enum:
          - BEFORE_OPEN
          - OPEN
          - LOCKED
        remainingTime:
          type: string
          description: 다음 상태까지 남은 시간 (mm:ss). LOCKED 시 00:00
          example: 05:10
        round:
          $ref: "#/components/schemas/RoundInfo"
      description: 매칭 상태 응답
    StatusMessage:
      type: object
      properties:
        type:
          type: string
          description: 메시지 타입
          example: STATUS
          enum:
          - STATUS
        count:
          minimum: 0
          type: integer
          description: 대기열 인원 수
          format: int64
          example: 12
        remainingTime:
          type: string
          description: 남은 시간(HH:MM:SS)
          example: 00:42:10
        state:
          type: string
          description: 상태 값
          example: OPEN
          enum:
          - BEFORE_OPEN
          - OPEN
          - LOCKED
          - LOCKED_HOLD
        round:
          $ref: "#/components/schemas/RoundInfo"
        serverTime:
          type: string
          description: "서버 기준 현재 시각(ISO_LOCAL_DATE_TIME, 선택)"
          example: 2025-08-14T12:10:50
      description: 매치 상태(WebSocket) 메시지
      example:
        type: STATUS
        count: 12
        remainingTime: 00:42:10
        state: OPEN
        round:
          id: 11111111-1111-1111-1111-111111111111
          "no": 3
          openAt: 2025-08-14T08:00:00
          lockAt: 2025-08-14T14:35:00
        serverTime: 2025-08-14T12:10:50
    UserIdMessage:
      required:
      - userId
      type: object
      properties:
        type:
          type: string
          description: 메시지 타입
          example: USER_ID
          enum:
          - USER_ID
        userId:
          type: string
          description: 서버가 판단한 로그인 사용자 ID(일반적으로 UUID 문자열)
          example: 969a6b7d-2a24-41ca-9f46-d1d2f8012844
      description: 사용자 식별(WebSocket) 메시지
      example:
        type: USER_ID
        userId: 969a6b7d-2a24-41ca-9f46-d1d2f8012844
    RoundInfo:
      type: object
      properties:
        id:
          type: string
          description: 라운드 ID (UUID)
          format: uuid
          example: 11111111-1111-1111-1111-111111111111
        "no":
          type: integer
          description: 라운드 번호
          format: int32
          example: 3
        openAt:
          type: string
          description: "OPEN 시작 시각 (KST, ISO_LOCAL_DATE_TIME)"
          example: 2025-08-18T20:50:00
        lockAt:
          type: string
          description: "LOCK 시각 (KST, ISO_LOCAL_DATE_TIME)"
          example: 2025-08-20T20:50:00
  securitySchemes:
    jwtAuth:
      type: http
      name: jwtAuth
      scheme: bearer
      bearerFormat: JWT
