openapi: 3.0.1
info:
  title: MLB Project API
  description: API documentation for the MLB project.
  version: v1.0.0
servers:
- url: http://api.fantasy11.click
  description: Generated server url
security:
- jwtAuth: []
tags:
- name: Chat Notification
  description: 채팅 알림 및 테스트 API
- name: Player Search
  description: 선수 검색 API (Elasticsearch)
- name: Chat Room
  description: 채팅방 조회 및 관리 API
- name: Draft
  description: 드래프트 관리 API
- name: Match
  description: 매칭 상태 조회
- name: Chat Search Management
  description: 채팅 검색 인덱스 관리 API
- name: Player Cache
  description: 선수 캐시 관리 API
- name: Chat Read State
  description: 채팅 만음 상태 관리 API
- name: Chat History
  description: 채팅 히스토리 조회 API
- name: Chat Search
  description: 채팅 메시지 검색 API
paths:
  /api/playerCache/cache:
    post:
      tags:
      - Player Cache
      summary: 선수 데이터 캐시링
      description: DB의 선수 데이터를 Redis 캐시로 로드합니다
      operationId: cachePlayerList
      responses:
        "500":
          description: 내부 서버 오류
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "200":
          description: 캐시링 성공
          content:
            '*/*':
              schema:
                type: string
  /api/notify/raw:
    post:
      tags:
      - Chat Notification
      summary: 직접 알림 전송
      description: 플레이어 이벤트 알림을 직접 전송합니다 (테스트용)
      operationId: raw
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RawNotify"
        required: true
      responses:
        "500":
          description: Internal Server Error
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "200":
          description: 알림 전송 성공
        "400":
          description: 잘못된 요청 데이터
  /api/draft/{roomId}/turn:
    post:
      tags:
      - turn-controller
      operationId: startOrUpdateTurn
      parameters:
      - name: roomId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartTurnRequest"
        required: true
      responses:
        "500":
          description: Internal Server Error
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "200":
          description: OK
  /api/draft/{roomId}/turn/snapshot:
    post:
      tags:
      - turn-controller
      operationId: snapshot
      parameters:
      - name: roomId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "500":
          description: Internal Server Error
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "200":
          description: OK
  /api/chat-rooms:
    post:
      tags:
      - Chat Room
      summary: 채팅방 생성
      description: 드래프트를 위한 새 채팅방을 생성합니다
      operationId: createChatRoom
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateChatRoomRequest"
        required: true
      responses:
        "500":
          description: Internal Server Error
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "400":
          description: 잘못된 요청 데이터
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ChatRoom"
        "200":
          description: 채팅방 생성 성공
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ChatRoom"
  /api/chat-rooms/{roomId}/reindex:
    post:
      tags:
      - Chat Search Management
      summary: 채팅 메시지 재인덱싱
      description: 지정된 채팅방의 모든 메시지를 Elasticsearch에 재인덱싱합니다
      operationId: reindex
      parameters:
      - name: roomId
        in: path
        description: 채팅방 ID
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "500":
          description: 내부 서버 오류
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: 채팅방을 찾을 수 없음
        "200":
          description: 재인덱싱 성공
  /api/chat-rooms/{roomId}/read-state:
    get:
      tags:
      - Chat Read State
      summary: 릶음 상태 조회
      description: 사용자의 마지막 읽은 메시지와 미읽 개수를 조회합니다
      operationId: getReadState
      parameters:
      - name: roomId
        in: path
        description: 채팅방 ID
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "500":
          description: 내부 서버 오류
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: 채팅방 멤버가 아님
          content:
            '*/*':
              schema:
                type: object
        "401":
          description: 인증되지 않은 사용자
          content:
            '*/*':
              schema:
                type: object
        "200":
          description: 읽음 상태 조회 성공
          content:
            '*/*':
              schema:
                type: object
    post:
      tags:
      - Chat Read State
      summary: 메시지 읽음 처리
      description: 지정된 메시지까지 읽음으로 표시합니다
      operationId: markRead
      parameters:
      - name: roomId
        in: path
        description: 채팅방 ID
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties:
                type: string
              description: 읽음 요청 데이터 (messageId 포함)
      responses:
        "500":
          description: 내부 서버 오류
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "200":
          description: 읽음 처리 성공
          content:
            '*/*':
              schema:
                type: object
        "403":
          description: 채팅방 멤버가 아님
          content:
            '*/*':
              schema:
                type: object
        "400":
          description: 잘못된 메시지 ID
          content:
            '*/*':
              schema:
                type: object
        "401":
          description: 인증되지 않은 사용자
          content:
            '*/*':
              schema:
                type: object
  /api/auth/reissue:
    post:
      tags:
      - auth-controller
      operationId: reissue
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties:
                type: string
        required: true
      responses:
        "500":
          description: Internal Server Error
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: object
  /api/auth/logout:
    post:
      tags:
      - auth-controller
      operationId: logout
      responses:
        "500":
          description: Internal Server Error
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: object
  /health:
    get:
      tags:
      - health-controller
      operationId: healthCheck
      responses:
        "500":
          description: Internal Server Error
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: string
  /api/user/seasonBestScore:
    get:
      tags:
      - season-user-score-controller
      operationId: getSeasonBestScore
      responses:
        "500":
          description: Internal Server Error
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SeasonUserScoreDto"
  /api/user/me:
    get:
      tags:
      - user-me-controller
      operationId: me
      responses:
        "500":
          description: Internal Server Error
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserMeResponse"
  /api/user/current-room:
    get:
      tags:
      - current-room-controller
      operationId: getCurrentRoom
      responses:
        "500":
          description: Internal Server Error
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: object
  /api/team/getTable:
    get:
      tags:
      - team-controller
      operationId: getTeamTable
      responses:
        "500":
          description: Internal Server Error
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TeamTableDto"
  /api/session-tokens:
    get:
      tags:
      - session-token-controller
      operationId: getTokens
      responses:
        "500":
          description: Internal Server Error
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: object
                additionalProperties:
                  type: string
  /api/playerEs/search:
    get:
      tags:
      - Player Search
      summary: 선수 검색
      description: 키워드와 엘리먼트 타입으로 선수를 검색합니다
      operationId: searchWithKeyword
      parameters:
      - name: keyword
        in: query
        description: 검색 키워드 (선수명 등)
        required: false
        schema:
          type: string
          default: ""
      - name: elementTypeId
        in: query
        description: 엘리먼트 타입 ID
        required: false
        schema:
          type: string
          default: ""
      responses:
        "500":
          description: 내부 서버 오류
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "200":
          description: 검색 성공
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PlayerEsDocument"
        "400":
          description: 잘못된 검색 파라미터
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PlayerEsDocument"
  /api/playerCache:
    get:
      tags:
      - Player Cache
      summary: 선수 목록 조회
      description: Redis 캐시에서 선수 목록을 조회합니다 (캐시 미스 시 DB에서 자동 로드)
      operationId: getPlayerList
      responses:
        "500":
          description: 내부 서버 오류
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "200":
          description: 선수 목록 조회 성공
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PlayerDto"
  /api/player/previousPlayer:
    get:
      tags:
      - player-controller
      operationId: getPreviousBestPlayer
      responses:
        "500":
          description: Internal Server Error
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PreviousBestPlayerDto"
  /api/notify/room/{roomId}:
    get:
      tags:
      - Chat Notification
      summary: 채팅방 알림 전송
      description: 특정 채팅방에 시스템 알림 메시지를 전송합니다 (테스트용)
      operationId: roomAlert
      parameters:
      - name: roomId
        in: path
        description: 채팅방 ID
        required: true
        schema:
          type: string
          format: uuid
      - name: text
        in: query
        description: 전송할 메시지 내용
        required: true
        schema:
          type: string
      responses:
        "500":
          description: Internal Server Error
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: 채팅방을 찾을 수 없음
          content:
            '*/*':
              schema:
                type: object
                additionalProperties:
                  type: object
        "200":
          description: 알림 전송 성공
          content:
            '*/*':
              schema:
                type: object
                additionalProperties:
                  type: object
  /api/match/status:
    get:
      tags:
      - Match
      summary: 현재 매칭 상태 조회
      description: "대기 인원수(count), 상태(state), 남은 시간(remainingTime, mm:ss), 라운드 정보\
        (round)를 반환합니다."
      operationId: getStatus
      responses:
        "500":
          description: Internal Server Error
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "200":
          description: 조회 성공
          content:
            application/json:
              examples:
                BEFORE_OPEN:
                  description: BEFORE_OPEN
                  value:
                    count: 27
                    state: BEFORE_OPEN
                    remainingTime: 12:34
                    round:
                      id: 11111111-1111-1111-1111-111111111111
                      "no": 3
                      openAt: 2025-08-18T20:50:00
                      lockAt: 2025-08-20T20:50:00
                OPEN:
                  description: OPEN
                  value:
                    count: 31
                    state: OPEN
                    remainingTime: 05:10
                    round:
                      id: 11111111-1111-1111-1111-111111111111
                      "no": 3
                      openAt: 2025-08-18T20:50:00
                      lockAt: 2025-08-20T20:50:00
                LOCKED:
                  description: LOCKED
                  value:
                    count: 0
                    state: LOCKED
                    remainingTime: 00:00
                    round:
                      id: 11111111-1111-1111-1111-111111111111
                      "no": 3
                      openAt: 2025-08-18T20:50:00
                      lockAt: 2025-08-20T20:50:00
  /api/elementType/all:
    get:
      tags:
      - element-type-controller
      operationId: getAllElementType
      responses:
        "500":
          description: Internal Server Error
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ElementTypeDto"
  /api/draft/{participantId}/players:
    get:
      tags:
      - Draft
      summary: 참여자별 선수 목록 조회
      description: 특정 참여자가 선택한 선수 리스트를 조회합니다
      operationId: getPlayersByParticipantId
      parameters:
      - name: participantId
        in: path
        description: 참여자 ID
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "500":
          description: Internal Server Error
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: 참여자를 찾을 수 없음
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DraftResponse"
        "200":
          description: 선수 목록 조회 성공
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DraftResponse"
  /api/draft/{draftId}/participants:
    get:
      tags:
      - Draft
      summary: 드래프트 참여자 목록 조회
      description: 드래프트 방에 속해있는 참여자 목록을 조회합니다
      operationId: getParticipantsByDraftId
      parameters:
      - name: draftId
        in: path
        description: 드래프트 ID
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "500":
          description: Internal Server Error
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: 드래프트를 찾을 수 없음
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DraftParticipant"
        "200":
          description: 참여자 목록 조회 성공
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DraftParticipant"
  /api/draft/{draftId}/allPlayers:
    get:
      tags:
      - Draft
      summary: 드래프트 전체 선수 목록 조회
      description: 드래프트에서 선택된 모든 선수 목록을 조회합니다
      operationId: getAllPlayersByDraftId
      parameters:
      - name: draftId
        in: path
        description: 드래프트 ID
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "500":
          description: Internal Server Error
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: 드래프트를 찾을 수 없음
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DraftResponse"
        "200":
          description: 선수 목록 조회 성공
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DraftResponse"
  /api/draft/squadLimit:
    get:
      tags:
      - Draft
      summary: 스쿼드 제한 검사
      description: 참여자의 스쿼드 제한을 검사합니다 (테스트용)
      operationId: isWithinSquadLimits
      parameters:
      - name: participantId
        in: query
        description: 참여자 ID
        required: true
        schema:
          type: string
          format: uuid
      - name: elementTypeId
        in: query
        description: 엘리먼트 타입 ID
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "500":
          description: Internal Server Error
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "200":
          description: 검사 완료
          content:
            '*/*':
              schema:
                type: boolean
        "400":
          description: 잘못된 요청 파라미터
          content:
            '*/*':
              schema:
                type: boolean
  /api/chat-rooms/{roomId}/search:
    get:
      tags:
      - Chat Search
      summary: 채팅 메시지 검색
      description: 지정된 채팅방에서 키워드로 메시지를 검색합니다
      operationId: search
      parameters:
      - name: roomId
        in: path
        description: 채팅방 ID
        required: true
        schema:
          type: string
          format: uuid
      - name: q
        in: query
        description: 검색 키워드
        required: false
        schema:
          type: string
          default: ""
      - name: cursor
        in: query
        description: 페이지 커서 (이전 조회의 nextCursor 값)
        required: false
        schema:
          type: string
      - name: limit
        in: query
        description: "조회할 메시지 개수 (1-50, 기본값: 20)"
        required: false
        schema:
          type: integer
          format: int32
          default: 20
      responses:
        "500":
          description: 내부 서버 오류
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: 채팅방 멤버가 아님
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ChatSearchResult"
        "200":
          description: 검색 성공
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ChatSearchResult"
  /api/chat-rooms/{roomId}/scoreboard:
    get:
      tags:
      - Chat Room
      summary: 채팅방 스코어보드 조회
      description: 채팅방 참가자들의 점수와 순위를 조회합니다
      operationId: scoreboard
      parameters:
      - name: roomId
        in: path
        description: 채팅방 ID
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "500":
          description: Internal Server Error
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: 채팅방을 찾을 수 없음
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ScoreboardItem"
        "200":
          description: 스코어보드 조회 성공
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ScoreboardItem"
  /api/chat-rooms/{roomId}/participants/{participantId}/roster:
    get:
      tags:
      - Chat Room
      summary: 참가자 로스터 조회
      description: 특정 참가자의 11명 로스터와 포메이션 정보를 조회합니다
      operationId: roster
      parameters:
      - name: roomId
        in: path
        description: 채팅방 ID
        required: true
        schema:
          type: string
          format: uuid
      - name: participantId
        in: path
        description: 참가자 ID
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "500":
          description: Internal Server Error
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: 참가자를 찾을 수 없음
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/RosterResponse"
        "200":
          description: 로스터 조회 성공
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/RosterResponse"
  /api/chat-rooms/{roomId}/messages:
    get:
      tags:
      - Chat History
      summary: 최신 채팅 메시지 조회
      description: 채팅방의 최신 메시지들을 지정된 개수만큼 조회합니다
      operationId: latest
      parameters:
      - name: roomId
        in: path
        description: 채팅방 ID
        required: true
        schema:
          type: string
          format: uuid
      - name: limit
        in: query
        description: "조회할 메시지 개수 (기본값: 30)"
        required: false
        schema:
          type: integer
          format: int32
          default: 30
      responses:
        "500":
          description: Internal Server Error
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: 채팅방을 찾을 수 없음
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ChatHistoryPage"
        "200":
          description: 메시지 조회 성공
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ChatHistoryPage"
  /api/chat-rooms/{roomId}/messages/before:
    get:
      tags:
      - Chat History
      summary: 이전 채팅 메시지 조회
      description: 커서 기반으로 이전 메시지들을 조회합니다 (무한스크롤용)
      operationId: before
      parameters:
      - name: roomId
        in: path
        description: 채팅방 ID
        required: true
        schema:
          type: string
          format: uuid
      - name: cursor
        in: query
        description: 페이지 커서 (이전 조회의 nextCursor 값)
        required: true
        schema:
          type: string
      - name: limit
        in: query
        description: "조회할 메시지 개수 (기본값: 30)"
        required: false
        schema:
          type: integer
          format: int32
          default: 30
      responses:
        "500":
          description: Internal Server Error
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: 채팅방을 찾을 수 없음
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ChatHistoryPage"
        "400":
          description: 잘못된 커서 값
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ChatHistoryPage"
        "200":
          description: 메시지 조회 성공
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ChatHistoryPage"
  /api/chat-rooms/getChatroomId:
    get:
      tags:
      - chat-room-controller
      operationId: roster_1
      parameters:
      - name: draftId
        in: query
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "500":
          description: Internal Server Error
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ChatRoomDto"
  /api/chat-rooms/by-draft/{draftId}:
    get:
      tags:
      - Chat Room
      summary: 드래프트 채팅방 조회
      description: 드래프트 ID로 해당 채팅방을 조회합니다
      operationId: getChatRoomByDraft
      parameters:
      - name: draftId
        in: path
        description: 드래프트 ID
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "500":
          description: Internal Server Error
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: 드래프트에 해당하는 채팅방을 찾을 수 없음
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ChatRoom"
        "200":
          description: 채팅방 조회 성공
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ChatRoom"
  /:
    get:
      tags:
      - root-redirect-controller
      operationId: redirectToLogin
      responses:
        "500":
          description: Internal Server Error
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "200":
          description: OK
components:
